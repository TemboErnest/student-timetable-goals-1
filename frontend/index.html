<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Timetable & Goals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Student Timetable & Goals</h1>

        <!-- Form to Add/Create Record -->
        <form id="timetable-form">
            <input type="hidden" id="record-id">
            
            <label for="course_code">Course Code:</label>
            <input type="text" id="course_code" required>

            <label for="course_name">Course Name:</label>
            <input type="text" id="course_name">

            <button type="submit" id="submit-btn">Add Record</button>
        </form>

        <h2>Timetable Records</h2>
        <!-- Table to List Records -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Course Code</th>
                    <th>Course Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="timetable-table-body">
                <!-- Records will be dynamically loaded here -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
